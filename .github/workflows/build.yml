name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (unzips O2Dialer*.zip if present)
        id: proj
        run: |
          shopt -s nullglob
          for z in O2Dialer*.zip; do
            echo "Unzipping $z"
            mkdir -p _src
            unzip -oq "$z" -d _src
          done
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "ERROR: settings.gradle.kts not found. Repo contents:"
            find . -not -path './.git/*' -maxdepth 3 | head -60
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Project dir: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain --stacktrace > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "=== KOTLIN / COMPILE ERRORS ==="
            grep -E "^e: |error:|What went wrong" -A3 build.log | head -80
          fi
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.proj.outputs.dir }}/build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-APK
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
