name: Build O2Dialer APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build O2Dialer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose repository
        shell: bash
        run: |
          echo "========================================"
          echo "CURRENT DIRECTORY"
          echo "========================================"
          pwd

          echo ""
          echo "========================================"
          echo "ROOT CONTENTS"
          echo "========================================"
          ls -la

          echo ""
          echo "========================================"
          echo "GRADLE PROJECT FILES"
          echo "========================================"
          find . -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -print

          echo ""
          echo "========================================"
          echo "APP DIRECTORIES"
          echo "========================================"
          find . -type d -name app -print

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle file found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found."
            echo "Expected:"
            echo "$PROJECT_DIR/app"
            exit 1
          fi

          echo "Android project detected successfully."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          cache-disabled: true

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Using project directory:"
          echo "$PROJECT_DIR"

      - name: Clean project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          gradle clean \
            --no-daemon \
            --console=plain

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -o pipefail

          gradle assembleDebug \
            --no-daemon \
            --console=plain \
            --stacktrace \
            2>&1 | tee build.log

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Available build outputs:"
            find app/build/outputs -type f 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "========================================"
          echo "O2Dialer BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-Build-Log
          path: ${{ steps.project.outputs.project_dir }}/build.log
          if-no-files-found: ignore
          retention-days: 14
