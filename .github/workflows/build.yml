name: Build O2Dialer APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build O2Dialer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          echo "Repository root:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "O2Dialer:"
          ls -la O2Dialer

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          cache-disabled: true

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify Gradle project
        working-directory: O2Dialer
        run: |
          echo "Gradle project:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 2 -type f \
            \( -name "settings.gradle*" -o -name "build.gradle*" \) \
            -print

      - name: Clean project
        working-directory: O2Dialer
        run: |
          gradle clean \
            --no-daemon \
            --console=plain

      - name: Build Debug APK
        working-directory: O2Dialer
        run: |
          set -o pipefail

          gradle assembleDebug \
            --no-daemon \
            --console=plain \
            --stacktrace \
            2>&1 | tee build.log

      - name: Verify APK
        working-directory: O2Dialer
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Available outputs:"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "========================================"
          echo ""
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-APK
          path: O2Dialer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-Build-Log
          path: O2Dialer/build.log
          if-no-files-found: ignore
          retention-days: 14
