name: Build O2Dialer APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o2dialer-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build O2Dialer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Find ZIP
      # ------------------------------------------------------------
      - name: Find O2Dialer ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for ZIP files..."

          mapfile -t ZIP_FILES < <(
            find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              -print
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::No ZIP file was found in the repository."
            echo ""
            echo "Repository contents:"
            find . -maxdepth 3 -type f -print | sort
            exit 1
          fi

          echo "ZIP files found:"
          printf '%s\n' "${ZIP_FILES[@]}"

          # Prefer a file containing O2Dialer in its name.
          ZIP_FILE=""

          for file in "${ZIP_FILES[@]}"; do
            if [[ "$(basename "$file")" == *O2Dialer* ]]; then
              ZIP_FILE="$file"
              break
            fi
          done

          # Fallback to the first ZIP if no O2Dialer-named ZIP exists.
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="${ZIP_FILES[0]}"
          fi

          echo ""
          echo "Selected ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 3. Extract project
      # ------------------------------------------------------------
      - name: Extract O2Dialer project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "${{ steps.zip.outputs.zip_file }}"

          unzip -q "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo ""
          echo "Extraction completed."

          echo ""
          echo "Top-level extracted contents:"
          find extracted -maxdepth 3 -print | sort | head -300

      # ------------------------------------------------------------
      # 4. Locate Android project
      # ------------------------------------------------------------
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for settings.gradle / settings.gradle.kts..."

          SETTINGS_FILE=$(
            find extracted \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              -quit
          )

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts was found inside the ZIP."

            echo ""
            echo "Extracted files:"
            find extracted -type f -print | sort | head -500

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Gradle settings file:"
          echo "$SETTINGS_FILE"

          echo ""
          echo "Android project directory:"
          echo "$PROJECT_DIR"

          # Verify root Gradle build file.
          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ] &&
             [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "::error::No root build.gradle or build.gradle.kts found."
            exit 1
          fi

          # Verify Android app module.
          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::No app directory found."
            echo ""
            echo "Project contents:"
            find "$PROJECT_DIR" -maxdepth 3 -print | sort
            exit 1
          fi

          echo ""
          echo "Android project detected successfully."

          echo ""
          echo "Project contents:"
          ls -la "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 5. Setup Java
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # 6. Setup Gradle
      # ------------------------------------------------------------
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          cache-disabled: true

      # ------------------------------------------------------------
      # 7. Setup Android SDK
      # ------------------------------------------------------------
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses > /dev/null || true

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # ------------------------------------------------------------
      # 8. Project information
      # ------------------------------------------------------------
      - name: Show build environment
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android project:"
          pwd

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( \
              -name "settings.gradle*" \
              -o \
              -name "build.gradle*" \
              -o \
              -name "gradle.properties" \
            \) \
            -print | sort

      # ------------------------------------------------------------
      # 9. Clean
      # ------------------------------------------------------------
      - name: Clean project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          gradle clean \
            --no-daemon \
            --console=plain

      # ------------------------------------------------------------
      # 10. Compile Kotlin
      # ------------------------------------------------------------
      - name: Compile Kotlin
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -o pipefail

          echo "Compiling Kotlin..."

          gradle compileDebugKotlin \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --info \
            2>&1 | tee kotlin-build.log

      # ------------------------------------------------------------
      # 11. Build Debug APK
      # ------------------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -o pipefail

          echo "Building Debug APK..."

          gradle assembleDebug \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --info \
            2>&1 | tee build.log

      # ------------------------------------------------------------
      # 12. Verify APK
      # ------------------------------------------------------------
      - name: Verify APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."

            echo ""
            echo "Available build outputs:"
            find app/build/outputs -type f -print 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "========================================"
          echo "O2Dialer BUILD SUCCESSFUL"
          echo "========================================"

          echo ""
          echo "APK:"
          ls -lh "$APK"

          echo ""
          echo "APK path:"
          realpath "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 13. Upload APK
      # ------------------------------------------------------------
      - name: Upload O2Dialer APK
        uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 14. Upload build logs
      # ------------------------------------------------------------
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-Build-Logs
          path: |
            ${{ steps.project.outputs.project_dir }}/build.log
            ${{ steps.project.outputs.project_dir }}/kotlin-build.log
          if-no-files-found: ignore
          retention-days: 14

      # ------------------------------------------------------------
      # 15. Upload Gradle reports if build fails
      # ------------------------------------------------------------
      - name: Upload Gradle reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-Gradle-Reports
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/reports/
            ${{ steps.project.outputs.project_dir }}/app/build/tmp/
          if-no-files-found: ignore
          retention-days: 14
