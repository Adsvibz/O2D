      - name: Diagnose Android project
        shell: bash
        run: |
          echo "========================================"
          echo "CURRENT DIRECTORY"
          echo "========================================"
          pwd

          echo ""
          echo "========================================"
          echo "ROOT FILES"
          echo "========================================"
          ls -la

          echo ""
          echo "========================================"
          echo "DIRECTORIES"
          echo "========================================"
          find . -maxdepth 2 -type d -print

          echo ""
          echo "========================================"
          echo "GRADLE FILES"
          echo "========================================"
          find . -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradle.properties" \) \
            -print

          echo ""
          echo "========================================"
          echo "ANDROID APP DIRECTORIES"
          echo "========================================"
          find . -type d -name app -print

          echo ""
          echo "========================================"
          echo "CHECKING EXPECTED ROOT"
          echo "========================================"

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "✓ settings.gradle found"
          else
            echo "✗ settings.gradle NOT found"
          fi

          if [ -f "build.gradle.kts" ] || [ -f "build.gradle" ]; then
            echo "✓ build.gradle found"
          else
            echo "✗ build.gradle NOT found"
          fi

          if [ -d "app" ]; then
            echo "✓ app directory found"
          else
            echo "✗ app directory NOT found"
          fi

          echo ""
          echo "========================================"
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "========================================"

          PROJECT_SETTINGS=$(find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -n "$PROJECT_SETTINGS" ]; then
            echo "Found Gradle project:"
            echo "$PROJECT_SETTINGS"

            PROJECT_DIR=$(dirname "$PROJECT_SETTINGS")

            echo ""
            echo "Project directory:"
            echo "$PROJECT_DIR"

            echo ""
            echo "Project contents:"
            ls -la "$PROJECT_DIR"
          else
            echo "ERROR: No Gradle settings file found anywhere."
            exit 1
          fi
