name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain --stacktrace > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "=== KOTLIN / COMPILE ERRORS ==="
            grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log | head -80
            echo "=== LAST 40 LINES ==="
            tail -40 build.log
          fi
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
