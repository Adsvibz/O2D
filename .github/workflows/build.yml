name: Build O2Dialer APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "O2Dialer/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=O2Dialer" >> "$GITHUB_ENV"
          else
            echo "ERROR: settings.gradle.kts was not found."
            echo "Repository structure:"
            find . -maxdepth 3 -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print
            exit 1
          fi

      - name: Install required Android SDK
        shell: bash
        run: |
          set -e

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses \
            > /dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 2 -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: Clean previous build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean --no-daemon --console=plain

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          if ! gradle \
            assembleDebug \
            --no-daemon \
            --console=plain \
            --stacktrace \
            2>&1 | tee build.log; then

            echo ""
            echo "========================================"
            echo "BUILD FAILED"
            echo "========================================"

            echo ""
            echo "=== GRADLE ERRORS ==="
            grep -E \
              "e: |ERROR|FAILURE:|What went wrong:|Execution failed|Could not resolve|Could not find" \
              build.log | head -100 || true

            echo ""
            echo "=== LAST 150 LINES ==="
            tail -150 build.log

            exit 1
          fi

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload O2Dialer APK
        uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-build-log
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: ignore
          retention-days: 14
