name: Build O2Dialer APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build O2Dialer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: DEBUG - Repository Structure
        shell: bash
        run: |
          echo "========================================"
          echo "CURRENT DIRECTORY"
          echo "========================================"
          pwd

          echo ""
          echo "========================================"
          echo "ROOT CONTENTS"
          echo "========================================"
          ls -la

          echo ""
          echo "========================================"
          echo "ALL WORKFLOWS"
          echo "========================================"
          find .github -type f -maxdepth 3 -print 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "SEARCH FOR O2Dialer PATH REFERENCES"
          echo "========================================"
          grep -RIn "ls O2Dialer\|working-directory.*O2Dialer\|O2Dialer/" .github 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "GRADLE PROJECT"
          echo "========================================"
          find . -maxdepth 2 -type f \
            \( -name "settings.gradle*" -o -name "build.gradle*" \) \
            -print

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          cache-disabled: true

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify Android project
        run: |
          set -e

          echo "Checking Android project..."

          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -d app

          echo "Android project detected successfully."

      - name: Clean project
        run: |
          gradle clean \
            --no-daemon \
            --console=plain

      - name: Build Debug APK
        run: |
          set -o pipefail

          gradle assembleDebug \
            --no-daemon \
            --console=plain \
            --stacktrace \
            2>&1 | tee build.log

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "O2Dialer BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-Build-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
