name: Build O2Dialer APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build O2Dialer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract O2Dialer ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found inside ZIP."
            echo ""
            echo "ZIP contents:"
            find extracted -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          cache-disabled: true

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Clean project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          gradle clean \
            --no-daemon \
            --console=plain

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -o pipefail

          gradle assembleDebug \
            --no-daemon \
            --console=plain \
            --stacktrace \
            2>&1 | tee build.log

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "O2Dialer BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-Build-Log
          path: ${{ steps.project.outputs.project_dir }}/build.log
          if-no-files-found: ignore
          retention-days: 14
